<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BEE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <!-- Favicon opcional -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Header del Chat -->
    <header class="chat-header">
      <div class="bot-info">
        <div class="bot-avatar">🤖</div>
        <div class="bot-details">
          <h1>BEE</h1>
          <span class="status" id="bot-status">En línea</span>
        </div>
      </div>
      <button id="clear-chat-btn" class="icon-btn" title="Borrar conversación">🗑️</button>
    </header>

    <!-- Área de Mensajes -->
    <main class="chat-messages" id="chat-messages">
      <!-- Mensaje de bienvenida (se genera dinámicamente o está hardcoded) -->
      <div class="message bot">
        <div class="message-content">
          ¡Qué onda maje! Soy BEE. ¿En qué te ayudo hoy?
        </div>
        <span class="message-time">Ahora</span>
      </div>
    </main>

    <!-- Indicador de "Escribiendo..." -->
    <div class="typing-indicator" id="typing-indicator" hidden>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- Área de Input -->
    <footer class="chat-input-area">
      <form id="chat-form" class="input-form">
        <textarea 
          id="message-input" 
          placeholder="Escribí tu mensaje, maje..." 
          rows="1"
          maxlength="1000"
          required
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
